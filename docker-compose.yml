services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smart-study-backend

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    ports:
      - "8000:8000"

    depends_on:
      - mysql

    command: php artisan serve --host=0.0.0.0 --port=8000

  mysql:
    image: mysql:8.0

    container_name: smart-study-mysql

    environment:
      MYSQL_DATABASE: smart_study_planner
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
